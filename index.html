    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "A IA realmente dá conta de atender meus clientes?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dá, e bem. A IA atende 24/7, faz triagem, tira dúvidas de cardápio, horário, preço, formas de pagamento e prazo de entrega, e leva o cliente pro seu cardápio online pra fechar o pedido. Depois ela confere o comprovante de PIX e acompanha o status — isso já cobre a maioria das mensagens que chegam no WhatsApp da sua loja. Quando aparece uma exceção, uma reclamação ou uma negociação que pede sensibilidade humana, ela passa pra sua equipe com o resumo da conversa pronto."
          }
        },
        {
          "@type": "Question",
          "name": "O cardápio online é cobrado à parte?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. O cardápio online já vem incluso no ZeloChat, sem custo extra. É onde o seu cliente monta o pedido — escolhe os itens, informa o endereço, vê a taxa de entrega e o total, e confirma. Seu cardápio, com o seu link, pronto pra compartilhar no WhatsApp, no status ou nas redes."
          }
        },
        {
          "@type": "Question",
          "name": "O ZeloChat integra com o iFood?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Hoje não sincronizamos com o iFood. Mas o ZeloChat resolve o mesmo problema por outro caminho: o cliente pede pelo seu cardápio online próprio, no seu WhatsApp, com o seu link. A diferença é que a venda é 100% sua, sem comissão de aplicativo por pedido — você fica com o cliente e com o valor cheio."
          }
        },
        {
          "@type": "Question",
          "name": "A IA lê comprovante PIX em imagem ou PDF?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O cliente pode mandar print do PIX ou o PDF do comprovante direto pelo WhatsApp. A IA lê o anexo, identifica nome do pagador e valor, e ajuda sua equipe a validar em segundos — sem precisar digitar conferência manual. Você pode configurar a IA pra só confirmar o pedido depois do comprovante chegar."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona o kanban de pedidos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cada pedido confirmado pelo WhatsApp vira um card no kanban — Novo, Em preparo, Pronto e Entregue/Retirado. Sua equipe arrasta o card de coluna conforme avança, e a cada mudança importante o cliente recebe automaticamente uma mensagem no WhatsApp avisando."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso ter o ZeloPDV para usar o ZeloChat?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. O ZeloChat funciona sozinho — você cadastra seus produtos, categorias e preços direto aqui e a IA já começa a atender. Se você também usa o Zelo PDV, a conta é a mesma e o catálogo fica sincronizado automaticamente entre os dois."
          }
        },
        {
          "@type": "Question",
          "name": "Como o ZeloChat conecta no meu WhatsApp?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Em poucos cliques você conecta seu WhatsApp ao ZeloChat e as conversas começam a chegar na plataforma em tempo real. Não precisa instalar nada no computador nem no celular."
          }
        },
        {
          "@type": "Question",
          "name": "Posso controlar quando a IA responde?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pode. Cada conversa tem um botão para ligar ou desligar a IA. Você ainda pode usar o modo 'sugerir resposta' (a IA escreve, você aprova antes de enviar) e montar respostas rápidas prontas para os atendentes humanos."
          }
        },
        {
          "@type": "Question",
          "name": "A IA conhece meus produtos e preços?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. A IA é treinada com o catálogo que você cadastra no ZeloChat — nomes, descrições, preços, políticas da loja e instruções que você definir. Se você também usa o Zelo PDV, o catálogo é o mesmo nos dois sistemas."
          }
        },
        {
          "@type": "Question",
          "name": "Meus dados e os dos meus clientes estão seguros?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Os dados da sua loja ficam isolados — ninguém de fora da sua conta enxerga suas conversas ou seus clientes. Todas as informações trafegam e são armazenadas de forma segura."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso instalar algum programa para imprimir os pedidos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. Você liga sua impressora térmica direto ao computador e conecta uma única vez clicando em 'Conectar impressora' na barra lateral. Pronto: todo pedido confirmado pelo WhatsApp é impresso automaticamente na cozinha — sem instalar nada."
          }
        },
        {
          "@type": "Question",
          "name": "Tem contrato de fidelidade ou multa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. Você paga mensalmente e cancela quando quiser, direto no painel. Sem fidelidade, sem multa, sem perguntas."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona o suporte?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Suporte em português, pelo próprio WhatsApp e por e-mail. Atendemos em horário comercial e respondemos dúvidas técnicas, de configuração e de integração com o Zelo PDV."
          }
        }
      ]
    }
    </script>

          "name": "Pedido cai no kanban",
