server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The SPA shell must never be heuristically cached. After a deploy, the
  # update banner reloads the current /app route and needs the newest
  # index.html immediately; otherwise operators end up needing Ctrl+F5.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
  }

  # Keep the service worker update check fresh. It does not cache app JS, but a
  # stale sw.js can still delay browser update semantics.
  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /sw.js =404;
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache, max-age=0" always;
    try_files /manifest.json =404;
  }

  # Vite emits content-hashed assets. These are safe to keep for a year and make
  # normal app loads faster without risking stale code after deploy.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri $uri/ /index.html;
  }
}
